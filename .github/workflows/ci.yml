name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke the installed wheel outside the source tree
        shell: bash
        run: |
          uv venv /tmp/b3desk-wheel
          uv pip install --python /tmp/b3desk-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/b3desk-wheel/bin/b3desk demo --out /tmp/b3desk-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: paper-report-${{ matrix.python }}
          path: /tmp/b3desk-artifacts/
