[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3-trading-agents"
version = "0.1.0"
description = "An auditable B3 research desk: Python calculates, language models narrate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Victor Pimenta"}]
dependencies = ["httpx>=0.28,<1", "rich>=13.9,<15", "textual>=1,<7", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
market = ["yfinance>=0.2.54,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
b3desk = "b3desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b3desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
